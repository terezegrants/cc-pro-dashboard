<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C&C Distribution | Executive Analytics Hub Pro Max</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0b10;
      --card-bg: rgba(22, 24, 35, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Pastel Palette */
      --pastel-mint: #a7f3d0;
      --pastel-lavender: #c084fc;
      --pastel-pink: #fbcfe8;
      --pastel-peach: #ffedd5;
      --pastel-blue: #bae6fd;
      --pastel-rose: #fecdd3;
      
      --font-serif: "Times New Roman", Times, serif;
    }

    * { box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-serif);
      margin: 0;
      padding: 28px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(192, 132, 252, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(167, 243, 208, 0.08) 0%, transparent 40%);
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 400;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #ffffff 0%, var(--pastel-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-group { display: flex; gap: 12px; }

    .btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--pastel-lavender);
      color: var(--pastel-lavender);
      background: rgba(192, 132, 252, 0.1);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .btn:hover { 
      background: var(--pastel-lavender); 
      color: #0a0b10; 
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 18px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
    }

    .control-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--pastel-mint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    select, input[type="text"] {
      width: 100%;
      background: #12131c;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      border-radius: 6px;
      outline: none;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .kpi-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .kpi-val { font-size: 1.9rem; margin: 8px 0 2px 0; font-weight: 400; }
    .kpi-sub { font-size: 0.8rem; color: var(--text-muted); }

    .charts-grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .charts-grid-2col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1100px) {
      .charts-grid-3col, .charts-grid-2col { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .chart-card h3 {
      margin-top: 0;
